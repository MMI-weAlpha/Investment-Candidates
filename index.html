<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Candidates">
<meta name="theme-color" content="#f5f5f7">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<title>Candidates</title>
<style>
  :root {
    --bg: #f5f5f7; --card: #fff; --text: #1c1c1e; --muted: #6e6e73; --line: #e3e3e8;
    --accent: #0a6cff; --danger: #d92d20; --chip: #eef1f6;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #000; --card: #1c1c1e; --text: #f2f2f7; --muted: #98989f; --line: #2c2c2e; --accent: #4c9aff; --danger: #ff6b60; --chip: #2c2c2e; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; }
  body { padding: env(safe-area-inset-top) 0 calc(90px + env(safe-area-inset-bottom)); }
  header { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 14px 16px 8px;
    display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  h1 { font-size: 28px; margin: 0; letter-spacing: -0.5px; }
  .iconbtn { border: 0; background: var(--chip); color: var(--text); border-radius: 999px;
    height: 36px; padding: 0 14px; font-size: 14px; }
  .filters { display: flex; gap: 8px; padding: 0 16px 8px; overflow-x: auto; }
  .filters input, .filters select { flex: 0 0 auto; border: 1px solid var(--line); background: var(--card);
    color: var(--text); border-radius: 10px; padding: 8px 10px; font-size: 15px; }
  .filters input { flex: 1 1 140px; min-width: 140px; }
  #list { padding: 0 16px; display: grid; gap: 12px; }
  .card { background: var(--card); border-radius: 16px; padding: 14px 16px; border: 1px solid var(--line); }
  .row { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
  .name { font-weight: 600; font-size: 17px; }
  .sym { color: var(--muted); font-size: 13px; }
  .price { font-weight: 600; font-size: 17px; text-align: right; white-space: nowrap; }
  .upd { color: var(--muted); font-size: 12px; text-align: right; }
  .cur { font-size: 14px; text-align: right; margin-top: 6px; white-space: nowrap; }
  .pos { color: #1a8f3c; } .neg { color: var(--danger); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chip { background: var(--chip); border-radius: 999px; padding: 3px 10px; font-size: 13px; }
  .notes { margin-top: 10px; color: var(--text); font-size: 15px; white-space: pre-wrap; }
  .links { margin-top: 10px; display: grid; gap: 6px; }
  .links a { color: var(--accent); text-decoration: none; font-size: 15px; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; display: block; }
  .actions { margin-top: 10px; display: flex; gap: 14px; }
  .actions button { border: 0; background: none; color: var(--accent); font-size: 15px; padding: 4px 0; }
  .actions .del { color: var(--danger); }
  .empty { text-align: center; color: var(--muted); padding: 48px 24px; }
  .fab { position: fixed; right: 18px; bottom: calc(18px + env(safe-area-inset-bottom)); width: 58px; height: 58px;
    border-radius: 50%; border: 0; background: var(--accent); color: #fff; font-size: 32px; line-height: 1;
    box-shadow: 0 6px 18px rgba(0,0,0,.25); }
  dialog { width: min(560px, 100%); max-height: 100%; margin: auto auto 0; border: 0; border-radius: 20px 20px 0 0;
    padding: 0; background: var(--bg); color: var(--text); }
  dialog::backdrop { background: rgba(0,0,0,.4); }
  .sheet { padding: 16px 16px calc(24px + env(safe-area-inset-bottom)); display: grid; gap: 12px; }
  .sheet h2 { margin: 0; font-size: 20px; }
  label { font-size: 13px; color: var(--muted); display: block; margin-bottom: 4px; }
  input[type=text], input[type=url], input[type=password], input[type=date], textarea, select.f {
    width: 100%; border: 1px solid var(--line); background: var(--card); color: var(--text);
    border-radius: 10px; padding: 11px 12px; font-size: 16px; font-family: inherit; }
  textarea { min-height: 80px; resize: vertical; }
  .results { background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .results button { display: block; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line);
    background: none; color: var(--text); padding: 10px 12px; font-size: 15px; }
  .results button:last-child { border-bottom: 0; }
  .results small { color: var(--muted); display: block; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .linkrow { display: grid; grid-template-columns: 1fr 36px; gap: 8px; margin-bottom: 8px; }
  .linkrow .rm { border: 0; background: var(--chip); color: var(--text); border-radius: 10px; font-size: 18px; }
  .btn { border: 0; border-radius: 12px; padding: 13px; font-size: 17px; font-weight: 600; width: 100%; }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn.secondary { background: var(--chip); color: var(--text); }
  .btn:disabled { opacity: .5; }
  .hint { color: var(--muted); font-size: 13px; }
  .err { color: var(--danger); font-size: 14px; }
  #toast { position: fixed; left: 50%; bottom: calc(90px + env(safe-area-inset-bottom)); transform: translateX(-50%);
    background: #000c; color: #fff; padding: 8px 14px; border-radius: 999px; font-size: 14px; display: none; z-index: 20; }
  [hidden] { display: none !important; }
  .seg { display: flex; margin: 0 16px 10px; background: var(--chip); border-radius: 10px; padding: 3px; }
  .seg button { flex: 1; border: 0; background: none; color: var(--muted); border-radius: 8px; padding: 7px 0; font-size: 15px; }
  .seg button.on { background: var(--card); color: var(--text); font-weight: 600; }
  #dash { margin: 0 16px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
  .dhead, .drow { display: grid; grid-template-columns: minmax(0, 1.8fr) minmax(0, 1fr) minmax(0, 1fr) 54px; gap: 8px; align-items: center; padding: 10px 14px; }
  .dhead { font-size: 12px; color: var(--muted); border-bottom: 1px solid var(--line); }
  .dhead span:nth-child(2), .dhead span:nth-child(3), .dhead span:nth-child(4) { text-align: right; }
  .drow { border-bottom: 1px solid var(--line); cursor: pointer; }
  .drow:last-child { border-bottom: 0; }
  .drow:active { background: var(--chip); }
  .dn .name { font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dc { text-align: right; font-size: 14px; }
  .dp { text-align: right; font-size: 14px; }
  .muted { color: var(--muted); }
  .dgrid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .dbox { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px; }
  .dbox .lbl { color: var(--muted); font-size: 12px; }
  .dbox .val { font-size: 16px; font-weight: 600; margin: 2px 0; }
  .dbox .sub { color: var(--muted); font-size: 12px; }
  :root { --ok: #1a8f3c; --okbg: #e8f5ec; }
  @media (prefers-color-scheme: dark) { :root { --ok: #34c759; --okbg: #12301b; } }
  .drow.invested { box-shadow: inset 3px 0 0 var(--ok); }
  .inv { color: var(--ok); font-size: 12px; margin-top: 2px; line-height: 1.25; }
  .invbox { margin-top: 14px; background: var(--okbg); border: 1px solid var(--ok); border-radius: 12px; padding: 12px; }
  .invbox .ih { color: var(--ok); font-weight: 600; font-size: 14px; }
  .invbox .invmeta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .invbox .ir { margin-top: 8px; white-space: pre-wrap; font-size: 15px; }
  .invbox .is { color: var(--muted); font-size: 12px; margin-top: 8px; }
  input[type=date] { -webkit-appearance: none; appearance: none; min-height: 46px; text-align: left; }
</style>
</head>
<body>
<header>
  <h1>Candidates</h1>
  <button class="iconbtn" id="refreshBtn" type="button">Kurse aktualisieren</button>
</header>
<div class="seg"><button type="button" id="vDash" class="on">Dashboard</button><button type="button" id="vCards">Details</button></div>
<div class="filters">
  <input id="q" type="search" placeholder="Suchen…" aria-label="Suchen">
  <select id="fSector" aria-label="Sektor"><option value="">Sektor</option></select>
  <select id="fRegion" aria-label="Region"><option value="">Region</option></select>
  <select id="fStatus" aria-label="Status"><option value="">Alle</option><option value="inv">Investiert</option><option value="watch">Nur beobachtet</option></select>
  <select id="fSort" aria-label="Sortierung"><option value="date">Neueste zuerst</option><option value="perf">Beste Performance</option><option value="name">Name A–Z</option></select>
</div>
<div id="dash"></div>
<main id="list"></main>
<button class="fab" id="addBtn" type="button" aria-label="Candidate hinzufügen">+</button>
<div id="toast"></div>

<dialog id="dlg">
  <form class="sheet" id="form" method="dialog">
    <h2 id="dlgTitle">Neuer Candidate</h2>

    <div id="searchBox">
      <label for="sq">Name oder Ticker</label>
      <input type="text" id="sq" autocomplete="off" autocapitalize="none" placeholder="z. B. Nestlé oder NESN.SW">
      <div class="results" id="results" hidden></div>
    </div>

    <div id="picked" hidden>
      <div class="row">
        <div><div class="name" id="pName"></div><div class="sym" id="pSym"></div></div>
        <div class="price" id="pPrice"></div>
      </div>
      <div class="hint" id="pHint">Dieser Kurs wird als Erfassungskurs fix gespeichert.</div>
    </div>

    <div class="grid2">
      <div><label for="fs">Sektor</label><input type="text" id="fs"></div>
      <div><label for="fc">Land</label><input type="text" id="fc"></div>
    </div>
    <div>
      <label for="fr">Region</label>
      <select class="f" id="fr"></select>
    </div>

    <div>
      <label for="fn">Notizen (warum interessant?)</label>
      <textarea id="fn"></textarea>
    </div>

    <div>
      <label>Artikel-Links</label>
      <div id="links"></div>
      <button type="button" class="btn secondary" id="addLink">+ Link hinzufügen</button>
    </div>

    <div class="err" id="err"></div>
    <button type="submit" class="btn primary" id="save" disabled>Speichern</button>
    <button type="button" class="btn secondary" id="cancel">Abbrechen</button>
  </form>
</dialog>

<dialog id="detailDlg">
  <div class="sheet">
    <div id="detailBody"></div>
    <button type="button" class="btn primary" id="dInv">Investment erfassen</button>
    <button type="button" class="btn secondary" id="dEdit">Candidate bearbeiten</button>
    <button type="button" class="btn secondary" id="dClose">Schliessen</button>
    <button type="button" class="btn secondary" id="dDel" style="color:var(--danger)">Löschen</button>
  </div>
</dialog>

<dialog id="invDlg">
  <form class="sheet" id="invForm" method="dialog">
    <h2 id="invTitle">Investment erfassen</h2>
    <div class="hint" id="invFor"></div>
    <div>
      <label for="iType">Art des Investments</label>
      <select class="f" id="iType">
        <option>Kauf Titel</option><option>Kauf Option</option><option>Verkauf Option</option><option>Andere</option>
      </select>
    </div>
    <div class="grid2">
      <div><label for="iDate">Datum</label><input type="date" id="iDate"></div>
      <div><label for="iQty">Anzahl</label><input type="text" id="iQty" inputmode="decimal" placeholder="z. B. 50"></div>
    </div>
    <div><label for="iPrice">Preis pro Stück / Kontrakt</label><input type="text" id="iPrice" inputmode="decimal"></div>
    <div><label for="iDet">Details (optional, z. B. Strike und Verfall bei Optionen)</label><input type="text" id="iDet"></div>
    <div>
      <label for="iRat">Begründung: Warum ist dieses Investment rational?</label>
      <textarea id="iRat" style="min-height:150px"></textarea>
      <div class="hint">Tipp: These, Bewertung, Risiken und wann du wieder aussteigen würdest.</div>
    </div>
    <div class="err" id="iErr"></div>
    <button type="submit" class="btn primary" id="iSave">Speichern</button>
    <button type="button" class="btn secondary" id="iCancel">Abbrechen</button>
    <button type="button" class="btn secondary" id="iDel" style="color:var(--danger)" hidden>Investment entfernen</button>
  </form>
</dialog>

<dialog id="codeDlg">
  <form class="sheet" id="codeForm" method="dialog">
    <h2>Zugangscode</h2>
    <p class="hint">Dieser Dienst ist mit einem Code geschützt.</p>
    <input type="password" id="codeInput" autocomplete="current-password">
    <button type="submit" class="btn primary">OK</button>
  </form>
</dialog>

<script src="/app.js"></script>
</body>
</html>
